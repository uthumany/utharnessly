name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/utharness dist/utharness-linux-x64
          sha256sum dist/utharness-linux-x64 > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/utharness-linux-x64
            dist/SHA256SUMS
