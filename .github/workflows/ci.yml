name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release

  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Verify init, memory, and doctor
        shell: bash
        run: |
          workdir="$(mktemp -d)"
          home="$(mktemp -d)"
          cd "$workdir"
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" init
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" memory add "CI persistence works"
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" memory search persistence
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" doctor
